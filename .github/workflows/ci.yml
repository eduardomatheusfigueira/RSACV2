# Revsist — Integração Contínua
#
# O portão que torna durável o que as Fases 0–5 corrigiram: um PR que
# reintroduza qualquer achado do doc 28 falha aqui, em vez de chegar ao
# `main` e só ser notado na próxima auditoria.
#
# A suíte de segurança roda em passo próprio, e de propósito: quando ela
# quebra, o log deve dizer "segurança" sem que ninguém precise ler a saída
# inteira do pytest.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # O Revsist tem dois bancos legítimos, e a matriz é o que impede que um deles
    # regrida em silêncio: SQLite é o perfil `desktop`, que já tem usuários;
    # PostgreSQL é o perfil `server`, para onde o produto está indo (doc 40
    # §40.2.1). Código que funciona só num dos dois é defeito, não escolha.
    name: Backend — ${{ matrix.banco }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        banco: [sqlite, postgresql]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # O serviço sobe nas duas variações da matriz — o GitHub Actions não
        # permite condicioná-lo — e é simplesmente ignorado na de SQLite.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rsac
          POSTGRES_PASSWORD: rsac
          POSTGRES_DB: rsac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rsac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Definir o banco desta variação
        # Vazio = SQLite em memória, que é o padrão da `conftest.py`.
        run: |
          if [ "${{ matrix.banco }}" = "postgresql" ]; then
            echo "RSAC_TEST_DATABASE_URL=postgresql+psycopg://rsac:rsac@localhost:5432/rsac_test" >> "$GITHUB_ENV"
          fi

      - name: Suíte de segurança
        # Primeiro e isolado: é o portão que impede a volta dos achados do
        # doc 28. Falha aqui é falha de segurança, não de funcionalidade.
        env:
          RSAC_DEPLOYMENT_PROFILE: ci
        run: pytest tests/test_security/ -v --tb=short

      - name: Migrações — modelo e revisões não podem divergir
        # `tests/test_schema/` cobre as três vias de `aplicar_migracoes`, o
        # `downgrade` e a divergência entre `models.py` e a última revisão. É o
        # `alembic check` de §40.2.3, escrito como teste para valer nos dois
        # bancos. Roda antes da suíte completa porque, quando falha, a causa é
        # sempre a mesma: alguém alterou o modelo e não gerou a revisão.
        env:
          RSAC_DEPLOYMENT_PROFILE: ci
        run: pytest tests/test_schema/ -v --tb=short

      - name: Suíte completa
        env:
          RSAC_DEPLOYMENT_PROFILE: ci
        run: pytest -q

      - name: Lint (ruff)
        # `continue-on-error` porque o repositório carrega dívida de estilo
        # anterior a este plano (~900 avisos). O objetivo aqui é tornar a
        # dívida visível sem travar PRs legítimos; quando ela for zerada,
        # remova esta linha.
        continue-on-error: true
        run: ruff check app tests

      - name: Vulnerabilidades conhecidas nas dependências
        continue-on-error: true
        run: pip-audit --desc

      - name: Análise estática de segurança (bandit)
        continue-on-error: true
        run: bandit -r app -ll -x app/../tests

  frontend:
    name: Frontend — typecheck, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes
        run: npx vitest run

      - name: Lint de tokens do design system
        continue-on-error: true
        run: npm run lint:tokens

      - name: Build web
        run: npm run build:web

      - name: Auditoria de dependências
        continue-on-error: true
        run: npm audit --omit=dev

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
