[project]
name = "rsac-backend"
version = "2.0.0"
description = "RSAC V2 — Revisão Sistemática Assistida por Computador (Backend API)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Eduardo Matheus Figueira" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    # Driver PostgreSQL do perfil `server` (doc 40 §40.2.1). O perfil
    # `desktop` continua em SQLite, que é embutido no Python.
    "psycopg[binary]>=3.2.0",
    "httpx>=0.28.0",
    "pymupdf>=1.25.0",
    "openpyxl>=3.1.5",
    "platformdirs>=4.3.0",
    "python-multipart>=0.0.18",
    "websockets>=14.0",
    "rapidfuzz>=3.10.0",
    "google-genai>=1.0.0",
    "openai>=1.60.0",
    "beautifulsoup4>=4.12.0",
    # Cifra dos backups de credenciais (app/security/secret_box.py)
    "cryptography>=44.0.0",
    # Hash de senhas das contas de acesso (app/security/passwords.py)
    "argon2-cffi>=23.1.0",
    # Verificação local do id_token do Google (app/security/google_oauth.py).
    # `joserfc` é o sucessor mantido de `authlib.jose`, que está depreciado.
    "joserfc>=1.0.0",
    # Análise de XML de terceiros resistente a expansão de entidades
    "defusedxml>=0.7.1",
    "lxml>=5.3.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.7.0",
    "bandit>=1.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "dns_real: exercita a resolução de nomes de verdade (guarda de saída)",
]
