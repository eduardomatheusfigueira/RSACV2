<!DOCTYPE html>
<html lang="pt-BR" data-theme="platinum-dusk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https: wss:;" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>RSAC V2 — Revisão Sistemática Assistida por Computador</title>

    <!--
      Splash de inicialização
      =======================
      O backend Python leva alguns segundos para subir. Em vez de exibir uma
      janela vazia nesse intervalo, a marca aparece imediatamente — antes mesmo
      do React montar. A Content-Security-Policy proíbe script inline, então
      quem remove esta camada é o main.tsx, assim que a aplicação monta.

      As cores aqui correspondem ao tema padrão "Platinum & Dusk Blue".
    -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: linear-gradient(160deg, #1a3350 0%, #0d1b2a 100%);
        font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
        transition: opacity 260ms ease-out;
      }
      #boot-splash.is-leaving { opacity: 0; }
      .boot-mark { width: 92px; height: 92px; }
      .boot-mark .boot-leg { stroke: #a3cef1; }
      .boot-mark .boot-ink { stroke: #ffffff; }
      .boot-word {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #ffffff;
        font-size: 21px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      .boot-beta {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #a3cef1;
        border: 1px solid #a3cef1;
        border-radius: 2px;
        padding: 2px 4px 2px 6px;
      }
      .boot-status {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #cbd8e4;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .boot-pulse {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #6096ba;
        animation: boot-pulse 1.15s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50%      { opacity: 1;    transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-pulse { animation: none; opacity: 1; }
        #boot-splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <!-- Monograma R-Lupa — mesma geometria de brand/generate_brand_assets.py -->
      <svg class="boot-mark" viewBox="-10 0 100 100" fill="none" stroke-width="14"
           stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="RSAC V2">
        <g class="boot-ink">
          <path d="M 7 7 V 93" />
          <circle cx="32" cy="32" r="25" />
        </g>
        <path class="boot-leg" d="M 45.946 52.749 L 73 93" />
      </svg>
      <div class="boot-word">RSAC<span class="boot-beta">Beta</span></div>
      <div class="boot-status"><span class="boot-pulse"></span>Iniciando ambiente de revisão</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
