appId: br.ufsc.rsac
productName: RSAC V2
copyright: Copyright © 2026 Eduardo Matheus Figueira
directories:
  output: release
  # Todos os assets abaixo são gerados por `python3 brand/generate_brand_assets.py`.
  # Não edite os binários à mão: regenere a partir da geometria da marca.
  buildResources: build
files:
  - out/**/*
  - package.json
# Ícone da janela para plataformas que não o extraem do executável (Linux e
# desenvolvimento). No Windows empacotado o ícone vem embutido no .exe.
extraResources:
  - from: resources/icon.png
    to: icon.png
  - from: resources/backend
    to: backend

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: RSAC V2
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: ${productName} ${version}

mac:
  icon: build/icon.icns
  category: public.app-category.productivity

linux:
  icon: build/icon.png
  category: Science
  target:
    - AppImage
